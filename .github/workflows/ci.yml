name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Secret Safety (.env untracked)
        run: |
          TRACKED_ENV=$(git ls-files .env)
          if [ -n "$TRACKED_ENV" ]; then
            echo "ERROR: .env file is tracked by git!"
            exit 1
          fi
          echo ".env file is untracked."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e .[dev]

      - name: Run Ruff Lint
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Suite with Coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing

  demorag-ci:
    name: DemoRAG Target Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd demo_target/demo_rag
          pip install -e .[dev]

      - name: Run Ruff Lint
        run: |
          cd demo_target/demo_rag
          ruff check .

      - name: Run DemoRAG Pytest Suite
        run: |
          cd demo_target/demo_rag
          pytest

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
